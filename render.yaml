services:
  - type: web
    name: project-a
    runtime: python
    plan: starter
    buildCommand: "true"
    startCommand: python3 server.py
    envVars:
      - key: PROJECT_A_DB
        value: /var/data/project_a.db
      - key: HTTPS
        value: "1"
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
